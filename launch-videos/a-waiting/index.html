      :root {
        --color-ground: #050505;
        --color-ink: #ededed;
        --color-accent: #ff5fb0;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #ground {
        position: absolute;
        inset: 0;
        background: var(--color-ground);
      }
    </style>
  </head>
