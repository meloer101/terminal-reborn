  <script>
    (() => {
      const tl = gsap.timeline();
      const ORDER = ["checkout","agg","webhook","lanes","mobile","cookie","search","vite"];
      const SCROLL = {"checkout":30,"agg":26,"webhook":22,"lanes":18,"mobile":28,"search":20,"vite":24};
      const RECTS = {"checkout":{"px":0,"py":0,"rx":16,"ry":216,"rw":728,"rh":104},"agg":{"px":480,"py":0,"rx":16,"ry":728,"rw":728,"rh":104},"webhook":{"px":960,"py":0,"rx":16,"ry":424,"rw":728,"rh":104},"lanes":{"px":1440,"py":0,"rx":16,"ry":832,"rw":728,"rh":104},"mobile":{"px":0,"py":540,"rx":16,"ry":320,"rw":728,"rh":104},"cookie":{"px":480,"py":540,"rx":16,"ry":112,"rw":728,"rh":104},"search":{"px":960,"py":540,"rx":16,"ry":936,"rw":728,"rh":104},"vite":{"px":1440,"py":540,"rx":16,"ry":528,"rw":728,"rh":104}};
      const PW = 478, PH = 538, LH = 20;

      // Feeds stream: whole lines, like a terminal, until the fold.
      for (const id of ORDER) {
        if (id === 'cookie') continue;
        const n = SCROLL[id];
        tl.fromTo('#feed-' + id, { y: 0 }, { y: -n * LH, duration: 8, ease: 'steps(' + n + ')' }, 0);
      }
      // Wavi's spinners (the product's own running glyph) turn throughout.
      tl.fromTo('#wall-side .spin', { rotation: 0 }, { rotation: 360 * 9, duration: 10, ease: 'none', svgOrigin: '7 7' }, 0);

      // Hops: ⌘1..⌘4 on the music's beat, each one a busy pane; the stuck pane 6 is never visited.
      tl.fromTo('#wall-hud-box', { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.2, ease: 'expo.out' }, 1.3);
      for (let i = 0; i < 4; i++) {
        const t = 1.5 + i * 0.75;
        const x = (i % 4) * 480, y = Math.floor(i / 4) * 540;
        tl.set('#wall-focus', { x, y, opacity: 1 }, t);
        tl.set('#wall-k2-n', { textContent: String(i + 1) }, t);
        tl.fromTo(['#wall-k1-fill', '#wall-k2-fill'], { opacity: 0.9 }, { opacity: 0, duration: 0.18, ease: 'power2.out', immediateRender: false }, t);
        tl.fromTo(['#wall-k1', '#wall-k2'], { y: 4 }, { y: 0, duration: 0.18, ease: 'power2.out' }, t);
      }
      tl.to('#wall-focus', { opacity: 0, duration: 0.1 }, 4.4);
      tl.to('#wall-hud-box', { opacity: 0, filter: 'blur(6px)', duration: 0.15, ease: 'power3.in' }, 4.35);

      // Punch in on the stuck pane.
      tl.fromTo('#wall-cam', { x: 0, y: 0, scale: 1, filter: 'blur(0px)' }, { x: -610.8000000000002, y: -1639.6000000000001, scale: 2.2, duration: 0.5, ease: 'power2.inOut' }, 4.5);
      tl.to('#wall-cam', { keyframes: [{ filter: 'blur(10px)', duration: 0.25, ease: 'power2.in' }, { filter: 'blur(0px)', duration: 0.25, ease: 'power2.out' }] }, 4.5);
      tl.fromTo('#wall-title .w', { opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.13, stagger: 0.067, ease: 'power2.out' }, 5.25);
      tl.to('#wall-title .w', { opacity: 0, filter: 'blur(8px)', duration: 0.18, stagger: 0.03, ease: 'power3.in' }, 7.35);

      // Pull back.
      tl.to('#wall-cam', { x: 0, y: 0, scale: 1, duration: 0.5, ease: 'power2.inOut' }, 7.5);
      tl.to('#wall-cam', { keyframes: [{ filter: 'blur(10px)', duration: 0.25, ease: 'power2.in' }, { filter: 'blur(0px)', duration: 0.25, ease: 'power2.out' }] }, 7.5);

      // Fold: every pane becomes its sidebar row.
      gsap.set('#wall-side .sb-head, #wall-side .row > *, #wall-rule', { opacity: 0 });
      gsap.set('#wall-side .row.sel', { backgroundColor: 'rgba(255,255,255,0)' });
      ORDER.forEach((id, i) => {
        const r = RECTS[id];
        const t = 8.05 + i * 0.05;
        tl.to('#pane-in-' + id, { opacity: 0, duration: 0.15, ease: 'power2.out' }, t - 0.05);
        tl.to('#pane-' + id, {
          x: r.rx - r.px, y: r.ry - r.py, scaleX: r.rw / PW, scaleY: r.rh / PH,
          borderColor: 'rgba(255,255,255,0)', backgroundColor: id === 'checkout' ? 'rgba(255,255,255,0.07)' : 'rgba(10,10,10,0)',
          duration: 0.6, ease: 'power3.inOut'
        }, t);
        tl.fromTo('#wall-row-' + id + ' > *', { opacity: 0 }, { opacity: 1, duration: 0.2, ease: 'power2.out' }, t + 0.45);
        tl.to('#pane-' + id, { opacity: 0, duration: 0.15 }, t + 0.6);
      });
      tl.to('#wall-row-checkout', { backgroundColor: 'rgba(255,255,255,0.07)', duration: 0.1 }, 8.6);
      tl.fromTo('#wall-side .sb-head, #wall-rule', { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power2.out' }, 8.7);
      // The scene is authored at 1x; the film plays it at SPEED (clip times above are already divided by it).
      const SPEED = 1.5;
      const film = gsap.timeline({ paused: true });
      film.add(tl.timeScale(SPEED), 0);
      window.__timelines['wall'] = film;
    })();
  </script>
