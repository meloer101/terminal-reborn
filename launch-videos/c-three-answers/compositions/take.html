  <script>
    (() => {
      // Authored at 1x on a 0.75 s grid (one beat at 120 BPM once the film plays at 1.5x).
      const tl = gsap.timeline();
      const CAM = {"open":{"x":810,"y":-1100,"scale":1},"wide":{"x":420,"y":-210,"scale":0.6},"t1":{"x":-1080,"y":-384,"scale":1.2},"t2":{"x":-3000,"y":576,"scale":1.2},"clash":{"x":-2040,"y":0,"scale":1.2},"t3":{"x":-4920,"y":1536,"scale":1.2},"all":{"x":-426,"y":565.2,"scale":0.42}};
      const LANES = [{"n":1,"y":1100,"tx":1100,"ty":400},{"n":2,"y":300,"tx":2700,"ty":-400},{"n":3,"y":-500,"tx":4300,"ty":-1200}];
      const B = (k) => k * 0.75;
      const show = (sel, t) => tl.to(sel, { opacity: 1, duration: 0.01 }, t);
      const hide = (sel, t) => tl.to(sel, { opacity: 0, duration: 0.01 }, t);
      // Camera: one take, never cut.
      const move = (to, t, d) => {
        tl.to('#take-cam', { ...CAM[to], duration: d, ease: 'power2.inOut' }, t);
        tl.to('#take-cam', { keyframes: [{ filter: 'blur(5px)', duration: d / 2, ease: 'power2.in' }, { filter: 'blur(0px)', duration: d / 2, ease: 'power2.out' }] }, t);
      };
      tl.fromTo('#take-cam', { ...CAM.open, filter: 'blur(0px)' }, { ...CAM.open, duration: 0.01 }, 0);
      tl.fromTo('#take-cam .spin', { rotation: 0 }, { rotation: 360 * 24, duration: 27, ease: 'none', svgOrigin: '7 7' }, 0);

      // The task forks into three branches (beat 1).
      tl.set('.tw', { opacity: 0 }, 0);
      tl.set('#take-cam .ln[data-k]', { opacity: 0 }, 0);
      tl.set(['#take-clash', '#take-note', '#take-t2-after'], { opacity: 0 }, 0);
      tl.set('#take-t2-prompt', { opacity: 1 }, 0);
      tl.set('.take-dot', { opacity: 0 }, 0);
      tl.to('.take-dot', { opacity: 1, duration: 0.2 }, B(1) + 0.5);
      move('wide', B(1), 1.0);
      LANES.forEach((l, i) => {
        tl.fromTo('#take-fork-' + l.n, { strokeDashoffset: 0.9 }, { strokeDashoffset: 0, duration: 0.7, ease: 'power2.out', immediateRender: false }, B(1) + i * 0.05);
        tl.fromTo('#take-tw' + l.n, { opacity: 0, scale: 0.96, filter: 'blur(6px)' }, { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 0.35, ease: 'expo.out' }, B(2) + i * 0.08);
        tl.to('#take-cam .ln[data-k="' + l.n + '-0"]', { opacity: 1, duration: 0.01 }, B(2) + 0.2 + i * 0.08);
      });
      tl.fromTo('#take-l1 .w', { opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.13, stagger: 0.067, ease: 'power2.out' }, B(2));
      tl.to('#take-l1 .w', { opacity: 0, filter: 'blur(8px)', duration: 0.15, stagger: 0.03, ease: 'power3.in' }, B(4) + 0.15);
      tl.fromTo('#take-l2 .w', { opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.13, stagger: 0.067, ease: 'power2.out' }, B(4) + 0.3);
      tl.to('#take-l2 .w', { opacity: 0, filter: 'blur(8px)', duration: 0.15, stagger: 0.03, ease: 'power3.in' }, B(7) - 0.15);

      // Lane 1: Claude Code 1; its result lands on beat 12.
      move('t1', B(7), 1.0);
      for (let i = 1; i < 13; i++) show('#take-cam .ln[data-k="1-' + i + '"]', B(12) - (11 - i) * 0.24);
      ['#take-t1-run', '#take-h1-run'].forEach((s) => hide(s, B(12) + 0.4));
      ['#take-t1-done', '#take-h1-done'].forEach((s) => show(s, B(12) + 0.4));

      // Lane 2: Claude Code 2, the conflict (beat 18), the wait (beat 22), the answer (beat 25).
      move('t2', B(14), 0.9);
      [0, 0.2, 0.35, 0.6, 0.75, 1.0, 1.15].forEach((d, i) => i && show('#take-cam .ln[data-k="2-' + i + '"]', B(15) + 0.15 + d));
      move('clash', B(17), 0.7);
      tl.fromTo('#take-clash', { opacity: 0 }, { opacity: 1, duration: 0.12 }, B(18));
      tl.fromTo('#take-clash-line', { strokeDashoffset: 60 }, { strokeDashoffset: 0, duration: 1.2, ease: 'none' }, B(18));
      move('t2', B(21), 0.6);
      for (let i = 0; i < 6; i++) show('#take-cam .ln[data-k="2-' + (100 + i) + '"]', B(22));
      ['#take-t2-run', '#take-h2-run'].forEach((s) => hide(s, B(22)));
      ['#take-t2-need', '#take-h2-need'].forEach((s) => show(s, B(22)));
      tl.fromTo('#take-note', { opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.15 }, B(22) + 0.05);
      tl.fromTo('#take-hb', { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.18, ease: 'expo.out' }, B(25) - 0.45);
      tl.fromTo('#take-k1 .fill', { opacity: 0.9 }, { opacity: 0, duration: 0.2, immediateRender: false }, B(25));
      tl.fromTo('#take-k1', { y: 4 }, { y: 0, duration: 0.2, immediateRender: false }, B(25));
      tl.to('#take-hb', { opacity: 0, filter: 'blur(6px)', duration: 0.15, ease: 'power3.in' }, B(25) + 0.6);
      hide('#take-t2-prompt', B(25) + 0.05);
      show('#take-t2-after', B(25) + 0.05);
      ['#take-t2-need', '#take-h2-need'].forEach((s) => hide(s, B(25) + 0.05));
      ['#take-t2-run', '#take-h2-run'].forEach((s) => show(s, B(25) + 0.05));
      tl.to('#take-note', { opacity: 0, duration: 0.15 }, B(25) + 0.05);
      [0.1, 0.3, 0.55, 0.75, 0.95, 1.5].forEach((d, i) => show('#take-cam .ln[data-k="2-' + (200 + i) + '"]', B(25) + d));
      ['#take-t2-run', '#take-h2-run'].forEach((s) => hide(s, B(27) + 0.15));
      ['#take-t2-done', '#take-h2-done'].forEach((s) => show(s, B(27) + 0.15));

      // Lane 3: Codex; its result lands on beat 32.
      move('t3', B(28), 0.9);
      for (let i = 1; i < 13; i++) show('#take-cam .ln[data-k="3-' + i + '"]', B(32) - (11 - i) * 0.18);
      ['#take-t3-run', '#take-h3-run'].forEach((s) => hide(s, B(32) + 0.3));
      ['#take-t3-done', '#take-h3-done'].forEach((s) => show(s, B(32) + 0.3));

      // Pull back over all three, a short hold, then the graph steps aside for Compare (beat 36).
      move('all', B(34), 0.75);
      tl.to('.world-fade, #take-card', { opacity: 0, duration: 0.4, ease: 'power2.inOut' }, B(35) + 0.15);
      // The scene is authored at 1x; the film plays it at SPEED (clip times above are already divided by it).
      const SPEED = 1.5;
      const film = gsap.timeline({ paused: true });
      film.add(tl.timeScale(SPEED), 0);
      window.__timelines['take'] = film;
    })();
