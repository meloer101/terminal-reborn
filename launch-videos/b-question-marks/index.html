<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Ground","default":"#050505"},
    {"id":"color-ink","type":"color","label":"Text","default":"#ededed"},
    {"id":"color-accent","type":"color","label":"Accent (waiting on you)","default":"#ff5fb0"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root { --color-ground: #050505; --color-ink: #ededed; --color-accent: #ff5fb0; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--color-ground); }
      #root { position: relative; width: 100%; height: 100%; }
      #ground { position: absolute; inset: 0; background: var(--color-ground); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="24.5" data-width="1920" data-height="1080">
      <div id="ground"></div>
      <div
        id="tube"
        data-composition-id="tube"
        data-composition-src="compositions/tube.html"
        data-start="0"
        data-duration="4.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="row"
        data-composition-id="row"
        data-composition-src="compositions/row.html"
        data-start="4.5"
        data-duration="4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="graph"
        data-composition-id="graph"
        data-composition-src="compositions/graph.html"
        data-start="8.5"
        data-duration="4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="tube2"
        data-composition-id="tube2"
        data-composition-src="compositions/tube2.html"
        data-start="12.5"
        data-duration="4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="type"
        data-composition-id="type"
        data-composition-src="compositions/type.html"
        data-start="16.5"
        data-duration="3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="end"
        data-composition-id="end"
        data-composition-src="compositions/end.html"
        data-start="19.5"
        data-duration="5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Sound effects: each on a visible action, peak one frame after the picture (bundled Pixabay library, assets/sfx/CREDITS.md). -->
      <audio id="sfx-hum" class="clip" src="assets/sfx/glitch-3.mp3" data-start="0.033" data-duration="3.096" data-track-index="10" data-volume="0.5"></audio>
      <audio id="sfx-j" class="clip" src="assets/sfx/key-press.mp3" data-start="3.357" data-duration="0.4" data-track-index="11" data-volume="2"></audio>
      <audio id="sfx-in1" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="4.321" data-duration="0.575" data-track-index="12" data-volume="0.5"></audio>
      <audio id="sfx-answer" class="clip" src="assets/sfx/click-soft.mp3" data-start="6.06" data-duration="0.366" data-track-index="13" data-volume="0.9"></audio>
      <audio id="sfx-done" class="clip" src="assets/sfx/pop.mp3" data-start="7.213" data-duration="0.72" data-track-index="10" data-volume="0.6"></audio>
      <audio id="sfx-in2" class="clip" src="assets/sfx/whoosh.mp3" data-start="8.321" data-duration="0.575" data-track-index="11" data-volume="0.45"></audio>
      <audio id="sfx-merge-key" class="clip" src="assets/sfx/key-press.mp3" data-start="9.727" data-duration="0.4" data-track-index="12" data-volume="2"></audio>
      <audio id="sfx-landed" class="clip" src="assets/sfx/pop.mp3" data-start="10.213" data-duration="0.72" data-track-index="13" data-volume="0.7"></audio>
      <audio id="sfx-in3" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="12.321" data-duration="0.575" data-track-index="10" data-volume="0.5"></audio>
      <audio id="sfx-nine" class="clip" src="assets/sfx/typing.mp3" data-start="12.979" data-duration="1.5" data-track-index="11" data-volume="1.4"></audio>
      <audio id="sfx-all" class="clip" src="assets/sfx/glitch-1.mp3" data-start="13.813" data-duration="2.638" data-track-index="12" data-volume="0.35"></audio>
      <audio id="sfx-off" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="15.971" data-duration="0.575" data-track-index="13" data-volume="0.35"></audio>
      <audio id="sfx-branch" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="16.46" data-duration="2.116" data-track-index="10" data-volume="0.4"></audio>
      <audio id="sfx-merge" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="16.047" data-duration="2.592" data-track-index="11" data-volume="0.3"></audio>
      <audio id="sfx-on" class="clip" src="assets/sfx/glitch-1.mp3" data-start="18.713" data-duration="2.638" data-track-index="12" data-volume="0.3"></audio>
      <audio id="sfx-cta" class="clip" src="assets/sfx/pop.mp3" data-start="20.413" data-duration="0.72" data-track-index="13" data-volume="0.5"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
