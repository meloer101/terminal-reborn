<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Ground","default":"#050505"},
    {"id":"color-ink","type":"color","label":"Text","default":"#ededed"},
    {"id":"color-accent","type":"color","label":"Accent (waiting on you)","default":"#ff5fb0"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root { --color-ground: #050505; --color-ink: #ededed; --color-accent: #ff5fb0; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--color-ground); }
      #root { position: relative; width: 100%; height: 100%; }
      #ground { position: absolute; inset: 0; background: var(--color-ground); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="22.5" data-width="1920" data-height="1080">
      <div id="ground"></div>
      <div
        id="tube"
        data-composition-id="tube"
        data-composition-src="compositions/tube.html"
        data-start="0"
        data-duration="4.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="row"
        data-composition-id="row"
        data-composition-src="compositions/row.html"
        data-start="4.5"
        data-duration="4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="graph"
        data-composition-id="graph"
        data-composition-src="compositions/graph.html"
        data-start="8.5"
        data-duration="3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="tube2"
        data-composition-id="tube2"
        data-composition-src="compositions/tube2.html"
        data-start="11.5"
        data-duration="4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="type"
        data-composition-id="type"
        data-composition-src="compositions/type.html"
        data-start="15.5"
        data-duration="3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="end"
        data-composition-id="end"
        data-composition-src="compositions/end.html"
        data-start="18.5"
        data-duration="4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Music: "do robots have a god?" by smilingcynic (ccMixter, CC BY 3.0, 120 BPM), entered on a beat at 16.045 s of the
           track; muffled and lower in the tube until J (3.5 s), open from there; limiter last. Credit in assets/sfx/CREDITS.md. -->
      <audio id="music" class="clip" src="assets/music/do-robots-have-a-god.mp3" data-timeline-role="music" data-start="0" data-duration="22.5" data-media-start="16.045" data-track-index="9" data-volume="1" data-fade-out="1.2" data-fx-chain="{&quot;version&quot;:1,&quot;nodes&quot;:[{&quot;type&quot;:&quot;lowpass&quot;,&quot;id&quot;:&quot;lp&quot;,&quot;label&quot;:&quot;Muffled in the tube until J&quot;,&quot;params&quot;:{&quot;frequency&quot;:1200}},{&quot;type&quot;:&quot;limiter&quot;,&quot;id&quot;:&quot;lim&quot;,&quot;params&quot;:{&quot;limit&quot;:-1}}]}" data-automation="{&quot;version&quot;:1,&quot;lanes&quot;:[{&quot;target&quot;:&quot;volume&quot;,&quot;points&quot;:[{&quot;t&quot;:0,&quot;v&quot;:0.55},{&quot;t&quot;:3.4,&quot;v&quot;:0.55},{&quot;t&quot;:3.5,&quot;v&quot;:0.82},{&quot;t&quot;:21.3,&quot;v&quot;:0.82}]},{&quot;target&quot;:&quot;fx.lp.frequency&quot;,&quot;points&quot;:[{&quot;t&quot;:0,&quot;v&quot;:1200},{&quot;t&quot;:3.3,&quot;v&quot;:1600,&quot;curve&quot;:0.6},{&quot;t&quot;:3.5,&quot;v&quot;:18000}]}]}"></audio>
      <!-- Sound effects: each on a visible action, peak one frame after the picture (bundled Pixabay library, assets/sfx/CREDITS.md). -->
      <audio id="sfx-hum" class="clip" src="assets/sfx/glitch-3.mp3" data-start="0.033" data-duration="3.096" data-track-index="10" data-volume="0.4"></audio>
      <audio id="sfx-j" class="clip" src="assets/sfx/key-press.mp3" data-start="3.457" data-duration="0.4" data-track-index="11" data-volume="2"></audio>
      <audio id="sfx-in1" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="4.371" data-duration="0.575" data-track-index="12" data-volume="0.5"></audio>
      <audio id="sfx-answer" class="clip" src="assets/sfx/click-soft.mp3" data-start="5.96" data-duration="0.366" data-track-index="10" data-volume="0.9"></audio>
      <audio id="sfx-done" class="clip" src="assets/sfx/pop.mp3" data-start="6.913" data-duration="0.72" data-track-index="11" data-volume="0.6"></audio>
      <audio id="sfx-in2" class="clip" src="assets/sfx/whoosh.mp3" data-start="8.371" data-duration="0.575" data-track-index="12" data-volume="0.45"></audio>
      <audio id="sfx-merge-key" class="clip" src="assets/sfx/key-press.mp3" data-start="9.457" data-duration="0.4" data-track-index="10" data-volume="2"></audio>
      <audio id="sfx-landed" class="clip" src="assets/sfx/pop.mp3" data-start="9.913" data-duration="0.72" data-track-index="11" data-volume="0.7"></audio>
      <audio id="sfx-in3" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="11.371" data-duration="0.575" data-track-index="12" data-volume="0.5"></audio>
      <audio id="sfx-nine" class="clip" src="assets/sfx/typing.mp3" data-start="12.079" data-duration="1.5" data-track-index="10" data-volume="1.4"></audio>
      <audio id="sfx-all" class="clip" src="assets/sfx/glitch-1.mp3" data-start="13.213" data-duration="2.638" data-track-index="11" data-volume="0.35"></audio>
      <audio id="sfx-off" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="15.121" data-duration="0.575" data-track-index="12" data-volume="0.35"></audio>
      <audio id="sfx-branch" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="15.46" data-duration="2.116" data-track-index="10" data-volume="0.4"></audio>
      <audio id="sfx-merge" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="15.047" data-duration="2.592" data-track-index="13" data-volume="0.3"></audio>
      <audio id="sfx-on" class="clip" src="assets/sfx/glitch-1.mp3" data-start="17.713" data-duration="2.638" data-track-index="11" data-volume="0.3"></audio>
      <audio id="sfx-cta" class="clip" src="assets/sfx/pop.mp3" data-start="19.413" data-duration="0.72" data-track-index="12" data-volume="0.5"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
