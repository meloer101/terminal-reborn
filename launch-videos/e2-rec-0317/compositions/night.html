  <div data-hf-id="hf-i4oj" id="root" data-composition-id="night" data-width="1920" data-height="1080">

      <canvas data-hf-id="hf-7bqi" id="night-osd" aria-hidden="true"></canvas>

  <script>
    (() => {
      const R = window.Rec;
      const N = window.Night;
      // Authored at 1x (one bar = 3.0511 s); the film plays this scene at SPEED.
      const SPEED = 1.5;
      const D = 22.375 * SPEED;
      const tl = gsap.timeline();
      R.fonts(['400 15px "Wavi Mono"', '700 34px "Wavi Mono"', '500 13px "Wavi Archivo"', '400 15px "JetBrains Mono"']).then(() => {

          rec.render(u / SPEED, st.fx);
          R.osd(rec.osd, { mode: 'rec', t: u / SPEED, clock: st.clock });
          N.readout(rec.osd, st.readout);
        });
        const film = gsap.timeline({ paused: true });
        film.add(tl.timeScale(SPEED), 0);
        window.__timelines['night'] = film;
