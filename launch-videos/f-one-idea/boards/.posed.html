<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Ground","default":"#050505"},

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines['main'] = gsap.timeline({ paused: true });

</html>
