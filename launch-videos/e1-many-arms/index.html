      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--color-water); }
      #root { position: relative; width: 100%; height: 100%; }
      #ground { position: absolute; inset: 0; background: var(--color-water); }
    </style>
