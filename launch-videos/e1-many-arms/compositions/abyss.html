  <script>
    (() => {
      const A = window.WaviAbyss;
      // The scene is authored at 1x; the film plays it at SPEED. Film times are authored / SPEED.
      const SPEED = 1.5;
      const DUR = 44.8;
      const tl = gsap.timeline();
      const film = gsap.timeline({ paused: true });
      const num = document.getElementById('counter-n');
      let R = null;
      let lastU = 0;
      const frame = (u) => {
        const t = u / SPEED;
        R.render(t);
        // The wait runs to 23 minutes in about five seconds, then holds (illustrative).
        const k = A.ramp(t, 16.6, 21.8);
        const secs = Math.round(23 * 60 * (k * k * (3 - 2 * k)));
        num.textContent = String(Math.floor(secs / 60)).padStart(2, '0') + ':' + String(secs % 60).padStart(2, '0');
      };
      // Registered at once so the runtime nests it; it draws once the faces and the GL are ready.
      A.drive(tl, DUR * SPEED, (u) => { if (u === lastU && R) return; lastU = u; if (R) frame(u); });
      film.add(tl.timeScale(SPEED), 0);
      window.__timelines['abyss'] = film;
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady['abyss'] = A.fonts(['500 40px "Wavi Mono"', '600 40px "Wavi Mono"']).then(() => {
        R = A.create(document.getElementById('abyss-gl'));
        frame(lastU);
      });
    })();
  </script>
