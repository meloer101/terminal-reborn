appId: dev.wavi.app
productName: Wavi
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - package.json
  # node-pty ships prebuilds for every platform; keep only what macOS needs.
  - '!node_modules/node-pty/prebuilds/win32-*/**'
  - '!node_modules/node-pty/{build,deps,src,scripts,typings,node-addon-api}/**'
  - '!node_modules/node-pty/lib/**/*.{test.js,map}'
extraResources:
  # Agent hook relay (src/main/hooks): found at process.resourcesPath/hooks when packaged.
  - from: resources/hooks
    to: hooks
# node-pty is N-API: its per-arch prebuilds are ABI-stable, so skip @electron/rebuild. Rebuilding would
# put a host-arch build/Release/pty.node (which node-pty prefers over prebuilds/) into the other arch's bundle.
npmRebuild: false
# Makes node-pty's spawn-helper executable before signing (build/after-pack.cjs).
afterPack: build/after-pack.cjs
asarUnpack:
  - node_modules/node-pty/**
  # electron-liquid-glass's N-API prebuilds (Liquid Glass shell, PRD §5 v1.95): a .node cannot load from inside the asar.
  - node_modules/electron-liquid-glass/**
mac:
  icon: build/icon.icns
  # Chromium ships ~55 locale packs the app never uses (its UI copy is Chinese/English).
  electronLanguages: [en, zh_CN, zh_TW]
  # Same pattern for every target so the arm64 and x64 downloads are unambiguous.
  artifactName: Wavi-${version}-${arch}.${ext}
  category: public.app-category.developer-tools
  # Developer ID: no `identity` here, so electron-builder signs with the "Developer ID Application" certificate
  # from CSC_LINK (CI) or the login keychain. Every Mach-O in the bundle is signed with it (frameworks, helpers,
  # node-pty's pty.node and spawn-helper under app.asar.unpacked); resources/hooks holds shell scripts only.
  # Without a certificate, `npm run dist` falls back to an ad-hoc build (scripts/dist.mjs).
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # Notarized with notarytool and stapled to the .app when APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER
  # are set (release.yml); the dmgs are notarized and stapled there too.
  notarize: true
  extendInfo:
    # Prompts for what programs in Wavi's terminals ask for (build/entitlements.mac.plist).
    NSAppleEventsUsageDescription: 在 Wavi 中运行的程序请求控制其他应用。
    NSMicrophoneUsageDescription: 在 Wavi 中运行的程序请求使用麦克风。
    NSCameraUsageDescription: 在 Wavi 中运行的程序请求使用摄像头。
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
dmg:
  # Signed with the same Developer ID (skipped when there is none), so the notarized dmg passes Gatekeeper as well.
  sign: true
publish:
  provider: github
